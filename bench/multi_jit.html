<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Array Language Benchmark — ink vs ngn/k vs goal vs q</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Menlo','Monaco',monospace; background:#0f1117; color:#e2e8f0; padding:2rem; line-height:1.6; }
h1  { font-size:1.5rem; color:#a5b4fc; margin-bottom:.25rem; }
h2  { font-size:1.1rem; color:#94a3b8; margin:2rem 0 1rem; border-bottom:1px solid #2d3148; padding-bottom:.4rem; }
h3  { font-size:.9rem;  color:#7dd3fc; margin:1.5rem 0 .75rem; }
.meta { font-size:.75rem; color:#64748b; margin-bottom:2rem; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; }
@media(max-width:900px){ .grid2{ grid-template-columns:1fr; } }
.card { background:#1e2130; border:1px solid #2d3148; border-radius:8px; padding:1.25rem; }
.full { grid-column:1/-1; }
canvas { max-height:300px; }
table { width:100%; border-collapse:collapse; font-size:.77rem; margin-top:.5rem; }
th { color:#64748b; text-align:right; padding:.35rem .6rem; border-bottom:1px solid #2d3148; }
th:first-child { text-align:left; }
td { padding:.3rem .6rem; text-align:right; border-bottom:1px solid #1a1d2e; }
td:first-child { text-align:left; color:#a5b4fc; }
tr:hover td { background:#252840; }
.badge { display:inline-block; font-size:.62rem; padding:1px 5px; border-radius:3px; background:#1a2540; color:#60a5fa; margin-left:.35rem; }
.err { color:#f87171; }
.best { color:#34d399; font-weight:bold; }
.note { font-size:.72rem; color:#64748b; margin-top:.75rem; }
</style>
</head>
<body>
<h1>Array Language Benchmarks: ink · ngn/k · goal · q</h1>
<div class="meta" id="meta"></div>

<h2>Basic Array Verbs</h2>
<div class="grid2" id="charts-basic"></div>

<h2>Heavy Math</h2>
<div class="grid2" id="charts-math"></div>

<h2>Results Tables</h2>
<div id="tables"></div>

<h2>Trading Strategy Benchmarks</h2>
<div class="card" id="strategy-table"></div>

<script>
const DATA = {"generated":"2026-05-02T15:28:05","backends":["ink"],"sizes":[1000,10000,100000,1000000],"benchmarks":{"baseline":{"description":"Allocate range !N / til N","group":"basic","complexity":"O(N)","backends":{"ink":{"1000":{"median_ms":7.913,"min_ms":7.31,"max_ms":10.554,"reps":5},"10000":{"median_ms":9.519,"min_ms":8.863,"max_ms":9.694,"reps":5},"100000":{"median_ms":26.606,"min_ms":24.44,"max_ms":28.617,"reps":5},"1000000":{"median_ms":196.616,"min_ms":191.696,"max_ms":199.183,"reps":5}}}},"sum":{"description":"Sum fold +/","group":"basic","complexity":"O(N)","backends":{"ink":{"1000":{"median_ms":9.964,"min_ms":9.568,"max_ms":11.291,"reps":5,"net_ms":2.051},"10000":{"median_ms":10.284,"min_ms":9.753,"max_ms":11.848,"reps":5,"net_ms":0.765},"100000":{"median_ms":16.936,"min_ms":16.425,"max_ms":17.252,"reps":5,"net_ms":0.0},"1000000":{"median_ms":74.017,"min_ms":72.366,"max_ms":76.279,"reps":5,"net_ms":0.0}}}},"max":{"description":"Max fold |/","group":"basic","complexity":"O(N)","backends":{"ink":{"1000":{"median_ms":8.993,"min_ms":8.119,"max_ms":9.199,"reps":5,"net_ms":1.08},"10000":{"median_ms":8.756,"min_ms":8.632,"max_ms":9.896,"reps":5,"net_ms":0.0},"100000":{"median_ms":14.892,"min_ms":12.937,"max_ms":16.486,"reps":5,"net_ms":0.0},"1000000":{"median_ms":65.223,"min_ms":60.977,"max_ms":72.133,"reps":5,"net_ms":0.0}}}},"reverse":{"description":"Double-reverse (round-trip)","group":"basic","complexity":"O(N)","backends":{"ink":{"1000":{"median_ms":10.306,"min_ms":9.01,"max_ms":12.134,"reps":5,"net_ms":2.393},"10000":{"median_ms":11.693,"min_ms":10.389,"max_ms":15.205,"reps":5,"net_ms":2.174},"100000":{"median_ms":28.913,"min_ms":28.116,"max_ms":30.371,"reps":5,"net_ms":2.307},"1000000":{"median_ms":211.779,"min_ms":211.384,"max_ms":214.245,"reps":5,"net_ms":15.163}}}},"grade":{"description":"Grade-up of reversed range (sort-indices)","group":"basic","complexity":"O(N log N)","backends":{"ink":{"1000":{"median_ms":10.3,"min_ms":9.756,"max_ms":11.007,"reps":5,"net_ms":2.387},"10000":{"median_ms":12.857,"min_ms":11.369,"max_ms":16.367,"reps":5,"net_ms":3.338},"100000":{"median_ms":39.357,"min_ms":37.918,"max_ms":40.658,"reps":5,"net_ms":12.751},"1000000":{"median_ms":304.791,"min_ms":294.547,"max_ms":306.342,"reps":5,"net_ms":108.175}}}},"distinct":{"description":"Distinct ? (N random draws from 0..99)","group":"basic","complexity":"O(N)","backends":{"ink":{"1000":{"median_ms":10.334,"min_ms":9.669,"max_ms":12.22,"reps":5,"net_ms":2.421},"10000":{"median_ms":13.305,"min_ms":11.635,"max_ms":14.485,"reps":5,"net_ms":3.786},"100000":{"median_ms":42.017,"min_ms":41.333,"max_ms":44.747,"reps":5,"net_ms":15.411},"1000000":{"median_ms":318.907,"min_ms":317.417,"max_ms":325.995,"reps":5,"net_ms":122.291}}}},"group":{"description":"Group = (100 buckets, N elements)","group":"basic","complexity":"O(N)","backends":{"ink":{"1000":{"median_ms":17.512,"min_ms":17.023,"max_ms":19.733,"reps":5,"net_ms":9.599},"10000":{"median_ms":24.627,"min_ms":23.857,"max_ms":25.483,"reps":5,"net_ms":15.108},"100000":{"median_ms":104.353,"min_ms":102.578,"max_ms":107.501,"reps":5,"net_ms":77.747},"1000000":{"median_ms":902.071,"min_ms":892.969,"max_ms":998.995,"reps":5,"net_ms":705.455}}}},"sqrt":{"description":"Element-wise sqrt","group":"math","complexity":"O(N)","backends":{"ink":{"1000":{"median_ms":10.691,"min_ms":9.819,"max_ms":12.088,"reps":5,"net_ms":2.778},"10000":{"median_ms":16.935,"min_ms":15.062,"max_ms":18.466,"reps":5,"net_ms":7.416},"100000":{"median_ms":76.936,"min_ms":75.45,"max_ms":79.069,"reps":5,"net_ms":50.33},"1000000":{"median_ms":648.095,"min_ms":641.426,"max_ms":1283.957,"reps":5,"net_ms":451.479}}}},"exp":{"description":"Element-wise exp","group":"math","complexity":"O(N)","backends":{"ink":{"1000":{"median_ms":9.603,"min_ms":9.21,"max_ms":10.449,"reps":5,"net_ms":1.69},"10000":{"median_ms":10.339,"min_ms":10.213,"max_ms":11.65,"reps":5,"net_ms":0.82},"100000":{"median_ms":22.954,"min_ms":20.721,"max_ms":23.734,"reps":5,"net_ms":0.0},"1000000":{"median_ms":124.204,"min_ms":121.776,"max_ms":125.578,"reps":5,"net_ms":0.0}}}},"log":{"description":"Element-wise log","group":"math","complexity":"O(N)","backends":{"ink":{"1000":{"median_ms":10.626,"min_ms":9.925,"max_ms":11.65,"reps":5,"net_ms":2.713},"10000":{"median_ms":16.344,"min_ms":15.706,"max_ms":17.526,"reps":5,"net_ms":6.825},"100000":{"median_ms":71.543,"min_ms":70.221,"max_ms":73.703,"reps":5,"net_ms":44.937},"1000000":{"median_ms":664.963,"min_ms":635.792,"max_ms":690.522,"reps":5,"net_ms":468.347}}}},"scan_sum":{"description":"Prefix sum scan +\\","group":"math","complexity":"O(N)","backends":{"ink":{"1000":{"median_ms":11.131,"min_ms":9.606,"max_ms":12.115,"reps":5,"net_ms":3.218},"10000":{"median_ms":18.304,"min_ms":17.836,"max_ms":18.75,"reps":5,"net_ms":8.785},"100000":{"median_ms":90.669,"min_ms":89.558,"max_ms":93.154,"reps":5,"net_ms":64.063},"1000000":{"median_ms":845.345,"min_ms":830.233,"max_ms":862.632,"reps":5,"net_ms":648.729}}}},"inner_product":{"description":"Sum-of-squares inner product","group":"math","complexity":"O(N)","backends":{"ink":{"1000":{"median_ms":11.897,"min_ms":11.449,"max_ms":13.337,"reps":5,"net_ms":3.984},"10000":{"median_ms":12.921,"min_ms":12.156,"max_ms":14.714,"reps":5,"net_ms":3.402},"100000":{"median_ms":19.999,"min_ms":18.554,"max_ms":20.048,"reps":5,"net_ms":0.0},"1000000":{"median_ms":81.233,"min_ms":80.92,"max_ms":81.837,"reps":5,"net_ms":0.0}}}}},"strategies":{"ma_crossover":{"description":"MA Crossover: 2D param sweep (190 backtests, 1249-day AAPL)","backends":{"ink":null}},"zscore_arb":{"description":"Z-Score Arb: 1D sweep (99 windows, 1249-day AAPL)","backends":{"ink":null}},"rsi_momentum":{"description":"RSI Momentum: 1D sweep (38 windows, fixed threshold)","backends":{"ink":null}}}};

const COLORS = {
  "ink":   "#a78bfa",
  "ngn/k": "#34d399",
  "goal":  "#f59e0b",
  "q":     "#60a5fa",
};
const BACKENDS = Object.keys(COLORS);
const sizes = DATA.sizes;

document.getElementById("meta").textContent =
  `generated: ${DATA.generated}  ·  sizes: ${sizes.map(n=>n>=1e6?(n/1e6)+"M":n>=1e3?(n/1e3)+"k":n).join(", ")}  ·  5 reps each`;

function makeChart(container, title, benchmarks, useNet) {
  const wrap = document.createElement("div");
  wrap.className = "card";
  wrap.innerHTML = `<h3>${title}</h3><canvas id="c_${title.replace(/\W/g,"_")}"></canvas>`;
  container.appendChild(wrap);
  const datasets = [];
  for (const [bname, color] of Object.entries(COLORS)) {
    const data = sizes.map(N => {
      const e = benchmarks?.backends?.[bname]?.[N];
      if (!e) return null;
      return useNet ? (e.net_ms ?? e.median_ms) : e.median_ms;
    });
    if (data.some(v=>v!=null)) {
      datasets.push({ label: bname, data, borderColor: color, backgroundColor: color+"22",
        tension:.3, pointRadius:4, pointHoverRadius:6 });
    }
  }
  new Chart(wrap.querySelector("canvas"), {
    type:"line", data:{
      labels: sizes.map(n=>n>=1e6?(n/1e6)+"M":n>=1e3?(n/1e3)+"k":String(n)),
      datasets,
    },
    options:{
      responsive:true,
      interaction:{mode:"index",intersect:false},
      scales:{
        x:{ grid:{color:"#1e2130"}, ticks:{color:"#64748b"} },
        y:{ grid:{color:"#1e2130"}, ticks:{color:"#64748b", callback:v=>v.toFixed(1)+"ms"} },
      },
      plugins:{
        legend:{labels:{color:"#94a3b8",boxWidth:12,font:{size:11}}},
        tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(2)} ms`}},
      },
    },
  });
}

// Build charts per group
const basicC  = document.getElementById("charts-basic");
const mathC   = document.getElementById("charts-math");
for (const [name, bm] of Object.entries(DATA.benchmarks)) {
  if (name === "baseline") continue;
  const container = bm.group === "math" ? mathC : basicC;
  makeChart(container, `${name} — ${bm.description} (${bm.complexity})`, bm, true);
}

// Summary tables per group
const tablesDiv = document.getElementById("tables");
for (const group of ["basic","math"]) {
  const names = Object.entries(DATA.benchmarks)
    .filter(([,b])=>b.group===group)
    .map(([n])=>n);
  if (!names.length) continue;

  const section = document.createElement("div");
  section.className = "card";
  section.style.marginBottom = "1.5rem";
  section.innerHTML = `<h3>${group === "basic" ? "Basic Verbs" : "Math Operations"} — net median ms (startup subtracted)</h3>`;

  const tbl = document.createElement("table");
  const hdrs = ["benchmark", "complexity", ...BACKENDS.flatMap(b=>[b])];
  tbl.innerHTML = `<thead><tr>${hdrs.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`;
  const tbody = document.createElement("tbody");
  for (const name of names) {
    const bm = DATA.benchmarks[name];
    // find best backend at N=1M
    const vals = {};
    for (const b of BACKENDS) {
      const e = bm.backends?.[b]?.[1000000];
      vals[b] = e ? (e.net_ms ?? e.median_ms) : null;
    }
    const validVals = Object.values(vals).filter(v=>v!=null);
    const best = validVals.length ? Math.min(...validVals) : null;
    const cells = [
      `${name}<span class="badge">${bm.complexity}</span>`,
      bm.description,
      ...BACKENDS.map(b => {
        const v = vals[b];
        if (v === null) return `<span class="err">—</span>`;
        const cls = v === best ? " class=\"best\"" : "";
        return `<span${cls}>${v.toFixed(1)}</span>`;
      }),
    ];
    tbody.innerHTML += `<tr>${cells.map(c=>`<td>${c}</td>`).join("")}</tr>`;
  }
  tbl.appendChild(tbody);
  section.appendChild(tbl);
  section.innerHTML += `<div class="note">Values at N=1,000,000. Green = fastest. "Net" subtracts per-backend startup/baseline time.</div>`;
  tablesDiv.appendChild(section);
}

// Strategy table
const stDiv = document.getElementById("strategy-table");
if (DATA.strategies && Object.keys(DATA.strategies).length) {
  const tbl = document.createElement("table");
  tbl.innerHTML = `<thead><tr><th>strategy</th><th>description</th>${BACKENDS.map(b=>`<th>${b}</th>`).join("")}</tr></thead>`;
  const tbody = document.createElement("tbody");
  for (const [name, s] of Object.entries(DATA.strategies)) {
    const vals = {};
    for (const b of BACKENDS) {
      const e = s.backends?.[b];
      vals[b] = e ? e.median_ms : null;
    }
    const validVals = Object.values(vals).filter(v=>v!=null);
    const best = validVals.length ? Math.min(...validVals) : null;
    const cells = [
      name, s.description,
      ...BACKENDS.map(b => {
        const v = vals[b];
        if (v === null) return `<span class="err">—</span>`;
        const cls = v === best ? " class=\"best\"" : "";
        return `<span${cls}>${v.toFixed(0)} ms</span>`;
      }),
    ];
    tbody.innerHTML += `<tr>${cells.map(c=>`<td>${c}</td>`).join("")}</tr>`;
  }
  tbl.appendChild(tbody);
  stDiv.appendChild(tbl);
  stDiv.innerHTML += `<div class="note">Whole-script timing including CSV load, parsing, param sweep, and output. 3 reps.</div>`;
} else {
  stDiv.innerHTML = "<p style='color:#64748b'>Strategy benchmarks not yet run.</p>";
}
</script>
</body>
</html>
