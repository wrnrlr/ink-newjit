<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ink benchmark results</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Menlo', 'Monaco', monospace;
    background: #0f1117;
    color: #e2e8f0;
    padding: 2rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; color: #a5b4fc; margin-bottom: 0.25rem; }
  .meta { font-size: 0.75rem; color: #64748b; margin-bottom: 2rem; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2.5rem; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .card {
    background: #1e2130;
    border: 1px solid #2d3148;
    border-radius: 8px;
    padding: 1.25rem;
  }
  .card h2 { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1rem; }
  .card-full { grid-column: 1 / -1; }
  table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  th { color: #64748b; text-align: right; padding: 0.4rem 0.75rem; border-bottom: 1px solid #2d3148; }
  th:first-child { text-align: left; }
  td { padding: 0.35rem 0.75rem; text-align: right; border-bottom: 1px solid #1a1d2e; }
  td:first-child { text-align: left; color: #a5b4fc; }
  tr:hover td { background: #252840; }
  .badge {
    display: inline-block;
    font-size: 0.65rem;
    padding: 1px 6px;
    border-radius: 3px;
    background: #1a2540;
    color: #60a5fa;
    margin-left: 0.4rem;
  }
  .err { color: #f87171; }
  canvas { max-height: 280px; }
</style>
</head>
<body>
<h1>ink &mdash; array language benchmarks</h1>
<div class="meta" id="meta"></div>

<div class="charts">
  <div class="card card-full">
    <h2>Raw median time (ms) vs N &mdash; all benchmarks</h2>
    <canvas id="chartAll"></canvas>
  </div>
  <div class="card card-full">
    <h2>Net time (ms, startup subtracted) vs N &mdash; non-baseline</h2>
    <canvas id="chartNet"></canvas>
  </div>
</div>

<div class="card">
  <h2>Results table (median ms)</h2>
  <table id="table"></table>
</div>

<script>
const DATA = {"generated":"2026-05-01T07:16:10","sizes":[1000,10000,100000,1000000],"benchmarks":{"baseline":{"description":"Allocate range !N","complexity":"O(N)","sizes":{"1000":{"median_ms":11.568,"min_ms":9.298,"max_ms":247.888,"reps":5},"10000":{"median_ms":9.234,"min_ms":8.967,"max_ms":10.048,"reps":5},"100000":{"median_ms":24.446,"min_ms":23.706,"max_ms":25.307,"reps":5},"1000000":{"median_ms":174.758,"min_ms":174.455,"max_ms":176.879,"reps":5}}},"sum":{"description":"Fold sum +/","complexity":"O(N)","sizes":{"1000":{"median_ms":9.578,"min_ms":9.08,"max_ms":10.113,"reps":5,"net_ms":0.0},"10000":{"median_ms":10.358,"min_ms":10.124,"max_ms":10.511,"reps":5,"net_ms":1.124},"100000":{"median_ms":15.818,"min_ms":14.796,"max_ms":16.124,"reps":5,"net_ms":0.0},"1000000":{"median_ms":69.143,"min_ms":68.02,"max_ms":72.752,"reps":5,"net_ms":0.0}}},"max":{"description":"Fold max |/","complexity":"O(N)","sizes":{"1000":{"median_ms":9.369,"min_ms":8.935,"max_ms":10.031,"reps":5,"net_ms":0.0},"10000":{"median_ms":8.644,"min_ms":8.545,"max_ms":8.785,"reps":5,"net_ms":0.0},"100000":{"median_ms":13.265,"min_ms":13.237,"max_ms":14.023,"reps":5,"net_ms":0.0},"1000000":{"median_ms":59.885,"min_ms":58.972,"max_ms":61.386,"reps":5,"net_ms":0.0}}},"reverse":{"description":"Reverse |","complexity":"O(N)","sizes":{"1000":{"median_ms":8.795,"min_ms":8.712,"max_ms":9.236,"reps":5,"net_ms":0.0},"10000":{"median_ms":10.227,"min_ms":10.202,"max_ms":10.251,"reps":5,"net_ms":0.993},"100000":{"median_ms":27.756,"min_ms":26.469,"max_ms":28.173,"reps":5,"net_ms":3.31},"1000000":{"median_ms":188.169,"min_ms":185.863,"max_ms":188.945,"reps":5,"net_ms":13.411}}},"sort":{"description":"Sort < (worst-case)","complexity":"O(N log N)","sizes":{"1000":{"median_ms":10.023,"min_ms":9.737,"max_ms":10.297,"reps":5,"net_ms":0.0},"10000":{"median_ms":11.594,"min_ms":11.329,"max_ms":12.354,"reps":5,"net_ms":2.36},"100000":{"median_ms":34.0,"min_ms":33.791,"max_ms":34.132,"reps":5,"net_ms":9.554},"1000000":{"median_ms":268.188,"min_ms":265.689,"max_ms":284.75,"reps":5,"net_ms":93.43}}},"distinct":{"description":"Distinct ?","complexity":"O(N)","sizes":{"1000":{"median_ms":10.517,"min_ms":10.303,"max_ms":10.612,"reps":5,"net_ms":0.0},"10000":{"median_ms":14.077,"min_ms":13.273,"max_ms":14.334,"reps":5,"net_ms":4.843},"100000":{"median_ms":49.959,"min_ms":49.26,"max_ms":53.855,"reps":5,"net_ms":25.513},"1000000":{"median_ms":477.057,"min_ms":454.328,"max_ms":509.066,"reps":5,"net_ms":302.299}}},"group":{"description":"Group = (100 keys)","complexity":"O(N)","sizes":{"1000":{"median_ms":17.447,"min_ms":17.361,"max_ms":18.029,"reps":5,"net_ms":5.879},"10000":{"median_ms":23.99,"min_ms":23.686,"max_ms":25.226,"reps":5,"net_ms":14.756},"100000":{"median_ms":97.629,"min_ms":96.978,"max_ms":98.355,"reps":5,"net_ms":73.183},"1000000":{"median_ms":814.825,"min_ms":811.909,"max_ms":816.617,"reps":5,"net_ms":640.067}}}}};

const COLORS = [
  '#a78bfa','#34d399','#f59e0b','#60a5fa','#f472b6','#4ade80','#fb923c',
];

const sizes = DATA.sizes;
const benchmarks = DATA.benchmarks;
const names = Object.keys(benchmarks);

document.getElementById('meta').textContent =
  `generated: ${DATA.generated}  ·  sizes: ${sizes.map(n => n.toLocaleString()).join(', ')}`;

function makeChart(id, datasets, logY = false) {
  const ctx = document.getElementById(id);
  return new Chart(ctx, {
    type: 'line',
    data: {
      labels: sizes.map(n => n >= 1_000_000 ? (n/1_000_000)+'M' : n >= 1_000 ? (n/1_000)+'k' : String(n)),
      datasets,
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { grid: { color: '#1e2130' }, ticks: { color: '#64748b' } },
        y: {
          type: logY ? 'logarithmic' : 'linear',
          grid: { color: '#1e2130' },
          ticks: { color: '#64748b', callback: v => v + ' ms' },
        },
      },
      plugins: {
        legend: { labels: { color: '#94a3b8', boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: {
          label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(2)} ms`,
        }},
      },
    },
  });
}

// Chart 1: raw median
const rawDatasets = names.map((name, i) => ({
  label: `${name} (${benchmarks[name].complexity})`,
  data: sizes.map(n => benchmarks[name].sizes[n]?.median_ms ?? null),
  borderColor: COLORS[i % COLORS.length],
  backgroundColor: COLORS[i % COLORS.length] + '22',
  tension: 0.3,
  pointRadius: 4,
}));
makeChart('chartAll', rawDatasets);

// Chart 2: net time (startup subtracted)
const netDatasets = names
  .filter(n => n !== 'baseline')
  .map((name, i) => ({
    label: `${name} (${benchmarks[name].complexity})`,
    data: sizes.map(n => benchmarks[name].sizes[n]?.net_ms ?? null),
    borderColor: COLORS[(i+1) % COLORS.length],
    backgroundColor: COLORS[(i+1) % COLORS.length] + '22',
    tension: 0.3,
    pointRadius: 4,
  }));
makeChart('chartNet', netDatasets);

// Table
const table = document.getElementById('table');
const hdr = ['benchmark', 'complexity', ...sizes.map(n =>
  n >= 1_000_000 ? (n/1_000_000)+'M' : (n/1_000)+'k'
)];
table.innerHTML = '<thead><tr>' + hdr.map((h,i) => `<th>${h}</th>`).join('') + '</tr></thead>';
const tbody = document.createElement('tbody');
for (const name of names) {
  const b = benchmarks[name];
  const cells = [
    `${name}<span class="badge">${b.complexity}</span>`,
    b.description,
    ...sizes.map(n => {
      const e = b.sizes[n];
      if (!e) return '<span class="err">err</span>';
      const net = e.net_ms !== undefined ? ` <span style="color:#64748b">(${e.net_ms})</span>` : '';
      return `${e.median_ms.toFixed(1)}${net}`;
    }),
  ];
  tbody.innerHTML += '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
}
table.appendChild(tbody);
</script>
</body>
</html>
