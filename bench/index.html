<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ink benchmark results</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Menlo', 'Monaco', monospace;
    background: #0f1117;
    color: #e2e8f0;
    padding: 2rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; color: #a5b4fc; margin-bottom: 0.25rem; }
  .meta { font-size: 0.75rem; color: #64748b; margin-bottom: 2rem; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2.5rem; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .card {
    background: #1e2130;
    border: 1px solid #2d3148;
    border-radius: 8px;
    padding: 1.25rem;
  }
  .card h2 { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1rem; }
  .card-full { grid-column: 1 / -1; }
  table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  th { color: #64748b; text-align: right; padding: 0.4rem 0.75rem; border-bottom: 1px solid #2d3148; }
  th:first-child { text-align: left; }
  td { padding: 0.35rem 0.75rem; text-align: right; border-bottom: 1px solid #1a1d2e; }
  td:first-child { text-align: left; color: #a5b4fc; }
  tr:hover td { background: #252840; }
  .badge {
    display: inline-block;
    font-size: 0.65rem;
    padding: 1px 6px;
    border-radius: 3px;
    background: #1a2540;
    color: #60a5fa;
    margin-left: 0.4rem;
  }
  .err { color: #f87171; }
  canvas { max-height: 280px; }
</style>
</head>
<body>
<h1>ink &mdash; array language benchmarks</h1>
<div class="meta" id="meta"></div>

<div class="charts">
  <div class="card card-full">
    <h2>Raw median time (ms) vs N &mdash; all benchmarks</h2>
    <canvas id="chartAll"></canvas>
  </div>
  <div class="card card-full">
    <h2>Net time (ms, startup subtracted) vs N &mdash; non-baseline</h2>
    <canvas id="chartNet"></canvas>
  </div>
</div>

<div class="card">
  <h2>Results table (median ms)</h2>
  <table id="table"></table>
</div>

<script>
const DATA = {"generated":"2026-05-02T17:00:24","sizes":[1000,10000,100000,1000000],"benchmarks":{"baseline":{"description":"Allocate range !N","complexity":"O(N)","sizes":{"1000":{"median_ms":0.2066,"min_ms":0.1946,"max_ms":6.8919,"reps":5},"10000":{"median_ms":0.4666,"min_ms":0.4361,"max_ms":0.5166,"reps":5},"100000":{"median_ms":3.1355,"min_ms":3.0444,"max_ms":3.2533,"reps":5},"1000000":{"median_ms":32.9033,"min_ms":32.139,"max_ms":33.1721,"reps":5}}},"sum":{"description":"Fold sum +/","complexity":"O(N)","sizes":{"1000":{"median_ms":0.4114,"min_ms":0.2928,"max_ms":0.4701,"reps":5,"net_ms":0.2048},"10000":{"median_ms":0.4551,"min_ms":0.3957,"max_ms":0.4718,"reps":5,"net_ms":0.0},"100000":{"median_ms":0.7857,"min_ms":0.6736,"max_ms":0.8369,"reps":5,"net_ms":0.0},"1000000":{"median_ms":3.2063,"min_ms":2.9745,"max_ms":3.2851,"reps":5,"net_ms":0.0}}},"max":{"description":"Fold max |/","complexity":"O(N)","sizes":{"1000":{"median_ms":0.3807,"min_ms":0.3709,"max_ms":0.4863,"reps":5,"net_ms":0.1741},"10000":{"median_ms":0.3845,"min_ms":0.3618,"max_ms":0.3933,"reps":5,"net_ms":0.0},"100000":{"median_ms":0.4845,"min_ms":0.4543,"max_ms":0.5154,"reps":5,"net_ms":0.0},"1000000":{"median_ms":1.4416,"min_ms":1.2613,"max_ms":1.5018,"reps":5,"net_ms":0.0}}},"reverse":{"description":"Reverse |","complexity":"O(N)","sizes":{"1000":{"median_ms":0.4565,"min_ms":0.3684,"max_ms":0.5941,"reps":5,"net_ms":0.2499},"10000":{"median_ms":0.76,"min_ms":0.6275,"max_ms":0.8992,"reps":5,"net_ms":0.2934},"100000":{"median_ms":3.6935,"min_ms":3.5779,"max_ms":3.8733,"reps":5,"net_ms":0.558},"1000000":{"median_ms":34.1605,"min_ms":33.9005,"max_ms":34.2162,"reps":5,"net_ms":1.2572}}},"sort":{"description":"Sort < (worst-case)","complexity":"O(N log N)","sizes":{"1000":{"median_ms":0.4985,"min_ms":0.4693,"max_ms":0.5554,"reps":5,"net_ms":0.2919},"10000":{"median_ms":0.9423,"min_ms":0.913,"max_ms":1.0479,"reps":5,"net_ms":0.4757},"100000":{"median_ms":5.3791,"min_ms":5.2557,"max_ms":5.441,"reps":5,"net_ms":2.2436},"1000000":{"median_ms":54.3737,"min_ms":53.653,"max_ms":54.7104,"reps":5,"net_ms":21.4704}}},"distinct":{"description":"Distinct ?","complexity":"O(N)","sizes":{"1000":{"median_ms":0.4843,"min_ms":0.4777,"max_ms":0.4951,"reps":5,"net_ms":0.2777},"10000":{"median_ms":0.8512,"min_ms":0.7938,"max_ms":1.0022,"reps":5,"net_ms":0.3846},"100000":{"median_ms":5.479,"min_ms":5.3539,"max_ms":5.5744,"reps":5,"net_ms":2.3435},"1000000":{"median_ms":64.124,"min_ms":64.0243,"max_ms":64.7951,"reps":5,"net_ms":31.2207}}},"group":{"description":"Group = (100 keys)","complexity":"O(N)","sizes":{"1000":{"median_ms":0.5096,"min_ms":0.4876,"max_ms":0.5289,"reps":5,"net_ms":0.303},"10000":{"median_ms":1.1152,"min_ms":1.0707,"max_ms":1.2137,"reps":5,"net_ms":0.6486},"100000":{"median_ms":6.5339,"min_ms":6.4862,"max_ms":6.7871,"reps":5,"net_ms":3.3984},"1000000":{"median_ms":62.5687,"min_ms":62.2539,"max_ms":62.8126,"reps":5,"net_ms":29.6654}}}}};

const COLORS = [
  '#a78bfa','#34d399','#f59e0b','#60a5fa','#f472b6','#4ade80','#fb923c',
];

const sizes = DATA.sizes;
const benchmarks = DATA.benchmarks;
const names = Object.keys(benchmarks);

document.getElementById('meta').textContent =
  `generated: ${DATA.generated}  ·  sizes: ${sizes.map(n => n.toLocaleString()).join(', ')}`;

function makeChart(id, datasets, logY = false) {
  const ctx = document.getElementById(id);
  return new Chart(ctx, {
    type: 'line',
    data: {
      labels: sizes.map(n => n >= 1_000_000 ? (n/1_000_000)+'M' : n >= 1_000 ? (n/1_000)+'k' : String(n)),
      datasets,
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { grid: { color: '#1e2130' }, ticks: { color: '#64748b' } },
        y: {
          type: logY ? 'logarithmic' : 'linear',
          grid: { color: '#1e2130' },
          ticks: { color: '#64748b', callback: v => v + ' ms' },
        },
      },
      plugins: {
        legend: { labels: { color: '#94a3b8', boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: {
          label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(2)} ms`,
        }},
      },
    },
  });
}

// Chart 1: raw median
const rawDatasets = names.map((name, i) => ({
  label: `${name} (${benchmarks[name].complexity})`,
  data: sizes.map(n => benchmarks[name].sizes[n]?.median_ms ?? null),
  borderColor: COLORS[i % COLORS.length],
  backgroundColor: COLORS[i % COLORS.length] + '22',
  tension: 0.3,
  pointRadius: 4,
}));
makeChart('chartAll', rawDatasets);

// Chart 2: net time (startup subtracted)
const netDatasets = names
  .filter(n => n !== 'baseline')
  .map((name, i) => ({
    label: `${name} (${benchmarks[name].complexity})`,
    data: sizes.map(n => benchmarks[name].sizes[n]?.net_ms ?? null),
    borderColor: COLORS[(i+1) % COLORS.length],
    backgroundColor: COLORS[(i+1) % COLORS.length] + '22',
    tension: 0.3,
    pointRadius: 4,
  }));
makeChart('chartNet', netDatasets);

// Table
const table = document.getElementById('table');
const hdr = ['benchmark', 'complexity', ...sizes.map(n =>
  n >= 1_000_000 ? (n/1_000_000)+'M' : (n/1_000)+'k'
)];
table.innerHTML = '<thead><tr>' + hdr.map((h,i) => `<th>${h}</th>`).join('') + '</tr></thead>';
const tbody = document.createElement('tbody');
for (const name of names) {
  const b = benchmarks[name];
  const cells = [
    `${name}<span class="badge">${b.complexity}</span>`,
    b.description,
    ...sizes.map(n => {
      const e = b.sizes[n];
      if (!e) return '<span class="err">err</span>';
      const net = e.net_ms !== undefined ? ` <span style="color:#64748b">(${e.net_ms})</span>` : '';
      return `${e.median_ms.toFixed(1)}${net}`;
    }),
  ];
  tbody.innerHTML += '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
}
table.appendChild(tbody);
</script>
</body>
</html>
