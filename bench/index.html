<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ink benchmark results</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Menlo', 'Monaco', monospace;
    background: #0f1117;
    color: #e2e8f0;
    padding: 2rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; color: #a5b4fc; margin-bottom: 0.25rem; }
  .meta { font-size: 0.75rem; color: #64748b; margin-bottom: 2rem; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2.5rem; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .card {
    background: #1e2130;
    border: 1px solid #2d3148;
    border-radius: 8px;
    padding: 1.25rem;
  }
  .card h2 { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1rem; }
  .card-full { grid-column: 1 / -1; }
  table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  th { color: #64748b; text-align: right; padding: 0.4rem 0.75rem; border-bottom: 1px solid #2d3148; }
  th:first-child { text-align: left; }
  td { padding: 0.35rem 0.75rem; text-align: right; border-bottom: 1px solid #1a1d2e; }
  td:first-child { text-align: left; color: #a5b4fc; }
  tr:hover td { background: #252840; }
  .badge {
    display: inline-block;
    font-size: 0.65rem;
    padding: 1px 6px;
    border-radius: 3px;
    background: #1a2540;
    color: #60a5fa;
    margin-left: 0.4rem;
  }
  .err { color: #f87171; }
  canvas { max-height: 280px; }
</style>
</head>
<body>
<h1>ink &mdash; array language benchmarks</h1>
<div class="meta" id="meta"></div>

<div class="charts">
  <div class="card card-full">
    <h2>Raw median time (ms) vs N &mdash; all benchmarks</h2>
    <canvas id="chartAll"></canvas>
  </div>
  <div class="card card-full">
    <h2>Net time (ms, startup subtracted) vs N &mdash; non-baseline</h2>
    <canvas id="chartNet"></canvas>
  </div>
</div>

<div class="card">
  <h2>Results table (median ms)</h2>
  <table id="table"></table>
</div>

<script>
const DATA = {"generated":"2026-04-29T14:26:52","sizes":[1000,10000,100000,1000000],"benchmarks":{"baseline":{"description":"Allocate range !N","complexity":"O(N)","sizes":{"1000":{"median_ms":3.799,"min_ms":3.624,"max_ms":202.716,"reps":5},"10000":{"median_ms":4.297,"min_ms":4.224,"max_ms":4.914,"reps":5},"100000":{"median_ms":6.723,"min_ms":6.521,"max_ms":8.004,"reps":5},"1000000":{"median_ms":35.453,"min_ms":34.224,"max_ms":36.558,"reps":5}}},"sum":{"description":"Fold sum +/","complexity":"O(N)","sizes":{"1000":{"median_ms":4.697,"min_ms":4.474,"max_ms":4.945,"reps":5,"net_ms":0.898},"10000":{"median_ms":4.713,"min_ms":4.57,"max_ms":5.366,"reps":5,"net_ms":0.416},"100000":{"median_ms":6.755,"min_ms":6.528,"max_ms":7.212,"reps":5,"net_ms":0.032},"1000000":{"median_ms":24.317,"min_ms":23.486,"max_ms":24.776,"reps":5,"net_ms":0.0}}},"max":{"description":"Fold max |/","complexity":"O(N)","sizes":{"1000":{"median_ms":4.407,"min_ms":3.935,"max_ms":4.948,"reps":5,"net_ms":0.608},"10000":{"median_ms":4.898,"min_ms":4.54,"max_ms":5.166,"reps":5,"net_ms":0.601},"100000":{"median_ms":6.277,"min_ms":5.862,"max_ms":6.547,"reps":5,"net_ms":0.0},"1000000":{"median_ms":20.975,"min_ms":20.664,"max_ms":21.298,"reps":5,"net_ms":0.0}}},"reverse":{"description":"Reverse |","complexity":"O(N)","sizes":{"1000":{"median_ms":4.975,"min_ms":4.357,"max_ms":5.065,"reps":5,"net_ms":1.176},"10000":{"median_ms":5.121,"min_ms":3.997,"max_ms":5.215,"reps":5,"net_ms":0.824},"100000":{"median_ms":7.807,"min_ms":7.498,"max_ms":8.408,"reps":5,"net_ms":1.084},"1000000":{"median_ms":36.914,"min_ms":35.846,"max_ms":38.184,"reps":5,"net_ms":1.461}}},"sort":{"description":"Sort < (worst-case)","complexity":"O(N log N)","sizes":{"1000":{"median_ms":4.842,"min_ms":4.538,"max_ms":5.406,"reps":5,"net_ms":1.043},"10000":{"median_ms":4.814,"min_ms":4.779,"max_ms":5.337,"reps":5,"net_ms":0.517},"100000":{"median_ms":9.772,"min_ms":9.537,"max_ms":10.116,"reps":5,"net_ms":3.049},"1000000":{"median_ms":56.317,"min_ms":55.929,"max_ms":57.201,"reps":5,"net_ms":20.864}}},"distinct":{"description":"Distinct ?","complexity":"O(N)","sizes":{"1000":{"median_ms":5.317,"min_ms":4.941,"max_ms":5.4,"reps":5,"net_ms":1.518},"10000":{"median_ms":5.366,"min_ms":5.045,"max_ms":5.444,"reps":5,"net_ms":1.069},"100000":{"median_ms":10.109,"min_ms":9.613,"max_ms":10.898,"reps":5,"net_ms":3.386},"1000000":{"median_ms":76.364,"min_ms":74.936,"max_ms":77.937,"reps":5,"net_ms":40.911}}},"group":{"description":"Group = (100 keys)","complexity":"O(N)","sizes":{"1000":{"median_ms":5.555,"min_ms":5.155,"max_ms":5.774,"reps":5,"net_ms":1.756},"10000":{"median_ms":5.974,"min_ms":5.528,"max_ms":6.348,"reps":5,"net_ms":1.677},"100000":{"median_ms":11.096,"min_ms":10.582,"max_ms":11.333,"reps":5,"net_ms":4.373},"1000000":{"median_ms":65.345,"min_ms":63.292,"max_ms":65.859,"reps":5,"net_ms":29.892}}}}};

const COLORS = [
  '#a78bfa','#34d399','#f59e0b','#60a5fa','#f472b6','#4ade80','#fb923c',
];

const sizes = DATA.sizes;
const benchmarks = DATA.benchmarks;
const names = Object.keys(benchmarks);

document.getElementById('meta').textContent =
  `generated: ${DATA.generated}  ·  sizes: ${sizes.map(n => n.toLocaleString()).join(', ')}`;

function makeChart(id, datasets, logY = false) {
  const ctx = document.getElementById(id);
  return new Chart(ctx, {
    type: 'line',
    data: {
      labels: sizes.map(n => n >= 1_000_000 ? (n/1_000_000)+'M' : n >= 1_000 ? (n/1_000)+'k' : String(n)),
      datasets,
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { grid: { color: '#1e2130' }, ticks: { color: '#64748b' } },
        y: {
          type: logY ? 'logarithmic' : 'linear',
          grid: { color: '#1e2130' },
          ticks: { color: '#64748b', callback: v => v + ' ms' },
        },
      },
      plugins: {
        legend: { labels: { color: '#94a3b8', boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: {
          label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(2)} ms`,
        }},
      },
    },
  });
}

// Chart 1: raw median
const rawDatasets = names.map((name, i) => ({
  label: `${name} (${benchmarks[name].complexity})`,
  data: sizes.map(n => benchmarks[name].sizes[n]?.median_ms ?? null),
  borderColor: COLORS[i % COLORS.length],
  backgroundColor: COLORS[i % COLORS.length] + '22',
  tension: 0.3,
  pointRadius: 4,
}));
makeChart('chartAll', rawDatasets);

// Chart 2: net time (startup subtracted)
const netDatasets = names
  .filter(n => n !== 'baseline')
  .map((name, i) => ({
    label: `${name} (${benchmarks[name].complexity})`,
    data: sizes.map(n => benchmarks[name].sizes[n]?.net_ms ?? null),
    borderColor: COLORS[(i+1) % COLORS.length],
    backgroundColor: COLORS[(i+1) % COLORS.length] + '22',
    tension: 0.3,
    pointRadius: 4,
  }));
makeChart('chartNet', netDatasets);

// Table
const table = document.getElementById('table');
const hdr = ['benchmark', 'complexity', ...sizes.map(n =>
  n >= 1_000_000 ? (n/1_000_000)+'M' : (n/1_000)+'k'
)];
table.innerHTML = '<thead><tr>' + hdr.map((h,i) => `<th>${h}</th>`).join('') + '</tr></thead>';
const tbody = document.createElement('tbody');
for (const name of names) {
  const b = benchmarks[name];
  const cells = [
    `${name}<span class="badge">${b.complexity}</span>`,
    b.description,
    ...sizes.map(n => {
      const e = b.sizes[n];
      if (!e) return '<span class="err">err</span>';
      const net = e.net_ms !== undefined ? ` <span style="color:#64748b">(${e.net_ms})</span>` : '';
      return `${e.median_ms.toFixed(1)}${net}`;
    }),
  ];
  tbody.innerHTML += '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
}
table.appendChild(tbody);
</script>
</body>
</html>
